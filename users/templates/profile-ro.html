{% extends "base.html" %}
{% load static %}
{% load widget_tweaks %}
{% block main_content %}
<div class="container mx-auto p-4">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl mb-4">Profile Settings</h2>

      <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        <!-- Avatar Upload -->
        <div class="form-control">
          <label class="label">
            <span class="label-text">Profile Picture</span>
          </label>
          <div class="flex items-center space-x-4">
            <div class="avatar">
              <div class="w-24 rounded-full">
                <img src="{{ user.get_avatar }}" alt="Profile Picture" />
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Username -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Username</span>
            </label>
            <label class="label">
              <span class="label-text">{{ form.username.value }}</span>
            </label>
          </div>

          <!-- Role -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Role</span>
            </label>

            {% if is_admin and not is_self %}
              {{ form.role|add_class:"select select-bordered" }}
              {{ form.role.errors }}
            {% else %}
              <label class="label">
                <span class="label-text">{{ form.role.value }}</span>
              </label>
            {% endif %}
          </div>

          <!-- First Name -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">First Name</span>
            </label>
            <label class="label">
              <span class="label-text">{{ form.first_name.value }}</span>
            </label>
          </div>

          <!-- Last Name -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Last Name</span>
            </label>
            <label class="label">
              <span class="label-text">{{ form.last_name.value }}</span>
            </label>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
